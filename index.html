<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="迷信的馬 Mac 版，查看九宮飛星、整理家人命盤，找到適合自己的添運方向。">
  <title>迷信的馬｜Mac 版下載</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
      color: #26243a;
      background: #f8f6f3;
    }

    * { box-sizing: border-box; }

    body { margin: 0; }

    a { color: #4134a1; }

    a:focus-visible {
      outline: 3px solid #6b55e9;
      outline-offset: 4px;
      border-radius: 4px;
    }

    .container {
      width: min(100% - 2rem, 1100px);
      margin-inline: auto;
    }

    header {
      padding: 1.4rem 0;
      border-bottom: 1px solid #e7e2dd;
    }

    .brand {
      font-size: .95rem;
      font-weight: 700;
      letter-spacing: .04em;
    }

    main { padding: clamp(3rem, 7vw, 6rem) 0 5rem; }

    .eyebrow {
      margin: 0 0 1rem;
      color: #645b80;
      font-size: .83rem;
      font-weight: 700;
      letter-spacing: .12em;
    }

    h1, h2, p { margin-top: 0; }

    h1 {
      max-width: 16ch;
      margin-bottom: 1.1rem;
      font-size: clamp(2.8rem, 7vw, 5rem);
      line-height: 1.12;
      letter-spacing: -.045em;
    }

    .intro {
      max-width: 29ch;
      margin-bottom: 3.5rem;
      color: #514d5b;
      font-size: clamp(1.18rem, 2.6vw, 1.55rem);
      line-height: 1.65;
    }

    h2 {
      margin-bottom: 1.35rem;
      font-size: clamp(1.5rem, 3vw, 2rem);
      line-height: 1.3;
    }

    .screenshots {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.5rem;
      margin-bottom: 4rem;
    }

    figure { margin: 0; }

    figure a {
      display: block;
      overflow: hidden;
      border: 1px solid #e4e0db;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 16px 40px rgba(41, 35, 57, .07);
    }

    figure img {
      display: block;
      width: 100%;
      height: auto;
    }

    figcaption {
      margin-top: .8rem;
      color: #5c5664;
      font-size: .95rem;
      line-height: 1.5;
    }

    .download {
      max-width: 720px;
      padding: clamp(1.5rem, 4vw, 2.5rem);
      border: 1px solid #ded8ef;
      border-radius: 22px;
      background: #f0ecfa;
    }

    .requirement {
      margin-bottom: .65rem;
      color: #4d4662;
      font-size: .95rem;
      font-weight: 700;
    }

    .download h2 { margin-bottom: 1.5rem; }

    .download-button {
      display: inline-block;
      padding: .95rem 1.5rem;
      border-radius: 12px;
      background: #4735ab;
      color: #fff;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
    }

    .download-button:hover { background: #37258e; }

    .release-link {
      display: inline-block;
      margin: 1rem 0 0 1.15rem;
      font-weight: 600;
    }

    .release-note {
      margin: 1.25rem 0 0;
      color: #5b5568;
      font-size: .9rem;
      line-height: 1.6;
    }

    .install {
      max-width: 720px;
      margin-top: 4rem;
    }

    .install ol {
      margin: 0;
      padding-left: 1.5rem;
      color: #514d5b;
      line-height: 1.9;
    }

    .install li { padding-left: .3rem; }

    footer {
      padding: 1.7rem 0 2.5rem;
      border-top: 1px solid #e7e2dd;
    }

    footer .container {
      display: flex;
      flex-wrap: wrap;
      gap: .8rem 1.5rem;
      align-items: center;
      justify-content: space-between;
    }

    footer p { margin: 0; color: #6b6571; font-size: .88rem; }

    footer nav { display: flex; flex-wrap: wrap; gap: .8rem 1.5rem; }

    @media (max-width: 680px) {
      .screenshots { grid-template-columns: 1fr; gap: 2rem; }
      .release-link { display: block; width: fit-content; margin-left: 0; }
    }

    @media (max-width: 390px) {
      .download-button { display: block; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container brand">迷信的馬 <span lang="en">Lucky Horse</span></div>
  </header>

  <main class="container">
    <p class="eyebrow">MAC 版</p>
    <h1>迷信的馬</h1>
    <p class="intro">查看九宮飛星、整理家人命盤，找到適合自己的添運方向。</p>

    <section aria-labelledby="screenshots-title">
      <h2 id="screenshots-title">看看 App 裡的畫面</h2>
      <div class="screenshots">
        <figure>
          <a href="images/01-overview.png" aria-label="查看九宮飛星總覽畫面原圖">
            <img src="images/01-overview.png" width="2880" height="1800" alt="Mac 版九宮飛星總覽，左側整理家人成員與住宅方位，右側顯示九個宮位的年度飛星。">
          </a>
          <figcaption>九宮飛星與家人資訊，一起查看。</figcaption>
        </figure>
        <figure>
          <a href="images/02-palace-details.png" aria-label="查看宮位詳情畫面原圖">
            <img src="images/02-palace-details.png" width="2880" height="1800" loading="lazy" alt="Mac 版東北宮位詳情，顯示飛星說明、五行關係及適合的色彩與擺設建議。">
          </a>
          <figcaption>點開宮位，細看飛星與添運建議。</figcaption>
        </figure>
      </div>
    </section>

    <section class="download" aria-labelledby="download-title">
      <p class="requirement">系統需求：macOS 14 或以上</p>
      <h2 id="download-title">在 Mac 上使用迷信的馬</h2>
      <a class="download-button" href="https://github.com/rollr76518/SuperstitiousHorse-Updates/releases/latest">下載 Mac 版</a>
      <a class="release-link" href="https://github.com/rollr76518/SuperstitiousHorse-Updates/releases">查看發行說明</a>
      <p class="release-note">下載連結會帶你到 GitHub 的最新 Release 頁面。</p>
    </section>

    <section class="install" aria-labelledby="install-title">
      <h2 id="install-title">安裝方式</h2>
      <ol>
        <li>在 Release 頁面下載 Mac 版 ZIP 檔。</li>
        <li>解壓縮後，將 <span lang="en">SuperstitiousHorse.app</span> 拖入「應用程式」資料夾。</li>
        <li>從「應用程式」開啟 App，開始查看九宮飛星。</li>
      </ol>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>© 2026 迷信的馬</p>
      <nav aria-label="其他資訊">
        <a href="https://rollr76518.github.io/superstitious-horse/privacy/">隱私權政策</a>
        <a href="https://rollr76518.github.io/superstitious-horse/support/">使用支援</a>
      </nav>
    </div>
  </footer>
</body>
</html>
